<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>Ruoxi Yu — Portfolio</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar" aria-label="Site controls">
      <button class="menu-button" id="menuButton" type="button" aria-label="Open menu" aria-expanded="false">
        <span class="menu-line menu-line-1"></span>
        <span class="menu-line menu-line-2"></span>
        <span class="menu-line menu-line-3"></span>
      </button>

      <button class="language-switch" id="languageSwitch" type="button" aria-label="Switch to Chinese">
        <span class="language-pill" aria-hidden="true"></span>
        <span class="language-label language-zh">中</span>
        <span class="language-label language-en">EN</span>
      </button>
    </header>

    <button class="home-link" id="homeLink" type="button">Ruoxi Yu</button>

    <aside class="menu-panel" id="menuPanel" aria-hidden="true">
      <nav class="menu-list" aria-label="Portfolio categories">
        <button type="button" class="menu-main" data-category="pd">Product &amp;<br />Interaction Design</button>
        <button type="button" class="menu-main" data-category="aigc">AIGC</button>
        <button type="button" class="menu-main" data-category="dm">Digital Media</button>
        <p class="menu-sub">
          <button type="button" data-category="games">Games</button><span> · </span>
          <button type="button" data-category="interactive">Interactive installations</button><span> · </span>
          <button type="button" data-category="digital-art">Digital art</button>
        </p>
        <button type="button" class="menu-main" data-category="gd">Graphic Design</button>
        <p class="menu-sub">
          <button type="button" data-category="campaign">Operational Design</button><span> · </span>
          <button type="button" data-category="campaign-design">Campaign</button><span> · </span>
          <button type="button" data-category="branding">Branding</button><span> · </span>
          <button type="button" data-category="posters">Posters</button><span> · </span>
          <button type="button" data-category="editorial">Editorial design</button><span> · </span>
          <button type="button" data-category="typography">Typography</button>
        </p>
        <button type="button" class="menu-main" data-category="tf">Theatre &amp; Film</button>
        <p class="menu-sub">
          <button type="button" data-category="scriptwriter">Scriptwriter</button><span> · </span>
          <button type="button" data-category="director">Director</button>
        </p>
      </nav>
    </aside>

    <main class="content-layer" id="contentLayer">
      <section class="intro-section" id="introSection" aria-label="Introduction">
        <p class="intro-copy" id="introCopy"></p>
      </section>

      <section class="category-area" id="categoryArea" aria-label="Selected category" hidden>
        <div class="category-primary" id="categoryPrimary"></div>
        <div class="category-secondary" id="categorySecondary" hidden></div>
      </section>

      <section class="project-grid" id="projectGrid" aria-label="Projects"></section>

      <article class="project-detail" id="projectDetail" hidden aria-live="polite"></article>
    </main>

    <script src="projects-data.js"></script>
    <script src="script.js"></script>
  </body>
</html>
